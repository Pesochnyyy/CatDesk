name: CatDesk Rust Acceptance

on:
  push:
    branches:
      - feature/catdesk-tailscale-funnel-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile
        run: cargo check --locked
      - name: Tests
        run: cargo test --locked
      - name: Formatting
        if: always()
        run: cargo fmt --all -- --check
      # Original Xeift/CatDesk has extensive existing Clippy warnings.
      # Keep lint diagnostics visible without treating upstream debt as a
      # regression in the experimental transport branch.
      - name: Clippy (upstream warnings advisory)
        if: always()
        run: cargo clippy --all-targets --locked
